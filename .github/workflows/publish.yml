name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "v$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.16.0

      - name: Verify registry check
        run: node --test .github/scripts/check-published.test.cjs

      - name: Check published version
        id: registry
        run: node .github/scripts/check-published.cjs

      - name: Prepare test dependencies
        uses: ./.github/actions/prepare-tests
        with:
          published-sdk: "true"

      - name: Run tests
        run: npm test

      - name: Check installable package
        env:
          COCOFAITH_SDK_FROM_REGISTRY: "1"
        run: npm run test:package

      - name: Publish package
        if: steps.registry.outputs.published == 'false'
        shell: bash
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC is unavailable. The publish job requires id-token: write."
            exit 1
          fi
          npm_tag="$(node -p "const version = require('./package.json').version; const prerelease = version.split('-')[1]; prerelease ? prerelease.split('.')[0] : 'latest'")"
          npm publish --ignore-scripts --access public --tag "$npm_tag" --provenance

  release:
    name: Create GitHub Release
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
